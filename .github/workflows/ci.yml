name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evergreen
          POSTGRES_PASSWORD: evergreen
          POSTGRES_DB: evergreen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evergreen -d evergreen_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://evergreen:evergreen@localhost:5432/evergreen_test
      AUTH_SECRET: ci-test-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WA_E164: "221770000000"
      S3_ENDPOINT: https://example.r2.cloudflarestorage.com
      S3_REGION: auto
      S3_ACCESS_KEY: ci
      S3_SECRET: ci
      S3_BUCKET_PUBLIC: evergreen-photos
      S3_BUCKET_VAULT: evergreen-vault
      S3_PUBLIC_BASE_URL: https://pub-ci.r2.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
